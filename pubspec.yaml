name: resumeyar
description: "رزومه‌یار — ساخت رزومه حرفه‌ای فارسی و انگلیسی و خروجی PDF"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: any

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Navigation
  go_router: ^18.0.0

  # Storage / filesystem
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3

  # Media
  image_picker: ^1.2.0

  # PDF
  pdf: ^3.11.3
  printing: ^5.14.2

  # Sharing
  share_plus: ^13.3.0

  # Misc
  uuid: ^4.5.1
  shamsi_date: ^1.1.1

  # On-device translation. Models download once, then run offline.
  google_mlkit_translation: ^0.15.1

  # Already pulled in by `pdf`; declared directly because the hand-written
  # xlsx reader/writer in lib/data/excel/ uses them. See xlsx.dart for why no
  # spreadsheet package is used.
  archive: ^4.0.9
  xml: ^7.0.1
  file_picker: ^12.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# Regenerate with:
#   flutter test tool/generate_app_icon.dart   (redraws the source PNGs)
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
# Generated Android resources are committed; nothing runs at build time.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#3B5BDB"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

flutter_native_splash:
  color: "#3B5BDB"
  image: assets/icon/app_icon_foreground.png
  android_12:
    color: "#3B5BDB"
    image: assets/icon/app_icon_foreground.png
  android: true
  ios: false
  web: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/Vazirmatn/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Bold.ttf
          weight: 700
